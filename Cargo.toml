[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# let-chains (1.88) are used across the workspace.
rust-version = "1.88"

[workspace.dependencies]
infraplot-model = { path = "crates/infraplot-model" }
infraplot-vault = { path = "crates/infraplot-vault" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
# gpui from crates.io: `gpui-pre` republishes Zed's gpui weekly, pinned exactly because its
# API moves between snapshots. A git dependency on zed would make `cargo install --git` clone
# the whole Zed repository.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = [
  "wayland",
  "x11",
] }
lyon = "1"
# Only for nmap's XML output (already in the tree through gpui's SVG stack).
roxmltree = "0.21"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "signal",
] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
strip = true
