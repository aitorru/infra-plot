name: Set up devenv
description: Nix + cachix + devenv, with cargo / pnpm caches kept under .devenv/state
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - name: Install devenv
      shell: bash
      run: nix profile install nixpkgs#devenv
    - uses: actions/cache@v6
      with:
        path: |
          .devenv/state/cargo/registry
          .devenv/state/cargo/git
          .devenv/state/pnpm-store
          target
        key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'devenv.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.job }}-
